<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes - JB Kang</title>
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 50px;
        }
        
        .nav {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        
        .nav-home-container {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        
        .home-circle {
            width: 12px;
            height: 12px;
            background-color: #FF6600;
            border-radius: 50%;
            margin-right: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .home-circle:hover {
            transform: scale(1.2);
        }
        
        .nav-home {
            color: #666;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .nav-home:hover {
            color: #000;
            border-bottom-color: #FF6600;
        }
        
        .nav-arrow {
            color: #666;
            margin-right: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-arrow:hover {
            color: #FF6600;
            transform: translateX(-2px);
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
        }
        
        .nav-links a {
            color: #666;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .nav-links a:hover {
            color: #000;
            border-bottom-color: #FF6600;
        }
        
        .nav-links a.current {
            color: #000;
        }
        
        /* CONSISTENT HEADER STYLING */
        .page-title {
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 25px;
            color: #000;
            letter-spacing: -0.02em;
        }
        
        .intro {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 60px;
            max-width: 700px;
        }

        /* Quote Display */
        .quote-display {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            padding: 0;
        }

        .current-quote {
            margin-bottom: 30px;
        }

        .quote-text {
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.5;
            color: #000;
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }

        .quote-attribution {
            text-align: center;
        }

        .quote-author {
            font-size: 0.95rem;
            color: #666;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .quote-source {
            font-size: 0.9rem;
            color: #999;
            font-weight: 400;
        }

        .quote-source a {
            color: #999;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .quote-source a:hover {
            color: #FF6600;
            border-bottom-color: #FF6600;
        }

        /* Quote Controls */
        .quote-controls {
            border-top: 1px solid #e0e0e0;
            padding-top: 30px;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .next-note-btn {
            background: transparent;
            color: #666;
            border: none;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .next-note-btn:hover {
            color: #000;
        }

        .next-note-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-arrow {
            font-size: 0.9rem;
            color: #999;
            transition: all 0.2s ease;
        }

        .next-note-btn:hover .btn-arrow {
            color: #FF6600;
            transform: translateX(2px);
        }

        .refresh-btn {
            display: none;
        }

        /* Status indicator */
        .status-indicator {
            font-size: 0.8rem;
            color: #999;
            margin-top: 20px;
            text-align: center;
        }

        .status-indicator.loading {
            color: #FF6600;
        }

        .status-indicator.error {
            color: #e74c3c;
        }

        .status-indicator.success {
            color: #27ae60;
        }

        /* Loading State */
        .loading .current-quote {
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        /* Fade Transition */
        .fade-transition {
            transition: opacity 0.4s ease;
        }

        /* RESPONSIVE DESIGN */
            @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
            
            .page-title {
                font-size: 2.2rem;
            }
            
            .intro {
                font-size: 1rem;
                margin-bottom: 40px;
            }
            
            .nav {
                font-size: 0.9rem;
            }
            
            .nav-home-container {
                margin-right: 15px;
            }
            
            .nav-arrow {
                margin-right: 15px;
            }
            
            .nav-links {
                gap: 12px;
            }

            .quote-text {
                font-size: 1.4rem;
            }

            .quote-display {
                padding: 0 !important;
                margin-top: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <nav class="nav">
            <div class="nav-home-container">
                <div class="home-circle"></div>
                <a href="https://jb-kang.com/index" class="nav-home">JB&nbsp;Kang</a>
            </div>
            <span class="nav-arrow" onclick="goBack()">←</span>
            <div class="nav-links">
                <a href="https://jb-kang.com/selected-works">Work</a>
                <a href="https://jb-kang.com/perfect-objects">Objects</a>
                <a href="https://jb-kang.com/quotes" class="current">Quotes</a>
                <a href="https://jb-kang.com/contacts">Contact</a>
            </div>
        </nav>

        <h1 class="page-title">Quotes</h1>
        
        <div class="intro">
            Thoughts worth sharing.
        </div>
    </div>

    <div class="quote-display" id="quoteDisplay">
        <div class="current-quote">
            <div class="quote-text fade-transition" id="quoteText">
                "Loading quotes..."
            </div>
            <div class="quote-attribution fade-transition" id="quoteAttribution">
                <div class="quote-author" id="quoteAuthor" style="display: none;">
                </div>
                <div class="quote-source" id="quoteSource" style="display: none;">
                </div>
            </div>
        </div>

        <div class="quote-controls">
            <div class="controls-container">
                <button class="next-note-btn" id="nextNoteBtn" onclick="getRandomQuote()">
                    next quote
                    <span class="btn-arrow">→</span>
                </button>
            </div>
            <div class="status-indicator" id="statusIndicator" style="display: none;">
            </div>
        </div>
    </div>

    <script>
        class QuoteManager {
            constructor() {
                this.quotes = [];
                this.shuffledQuotes = [];
                this.currentShuffleIndex = 0;
                this.isLoading = false;
                
                // Path to your JSON file
                this.quotesUrl = '/quotes.json';
                
                // Fallback quotes in case the JSON file fails to load
                this.fallbackQuotes = [
                    {
                        text: "We cannot direct the wind, but we can adjust our sails",
                        author: "Aristotle",
                        occupation: "",
                        source: "",
                        source_url: ""
                    },
                    {
                        text: "Think of yourself as dead. You have lived your life. Now take what's left and live it properly.",
                        author: "Marcus Aurelius",
                        occupation: "Roman Emperor",
                        source: "",
                        source_url: ""
                    },
                    {
                        text: "Pain + Reflection = Progress",
                        author: "",
                        occupation: "",
                        source: "",
                        source_url: ""
                    }
                ];
                
                this.initializeQuotes();
            }

            async initializeQuotes() {
                try {
                    this.isLoading = true;
                    this.updateStatus('Loading quotes database...', 'loading');
                    
                    const response = await fetch(this.quotesUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    this.quotes = data.quotes || [];
                    this.initializeShuffledQuotes();
                    this.displayInitialQuote();
                    
                    const updateTime = data.updated ? new Date(data.updated).toLocaleDateString() : 'recently';
                    this.hideStatus();
                } catch (error) {
                    console.error('Failed to load quotes from JSON:', error);
                    this.updateStatus('Using offline quotes (check console for details)', 'error');
                    this.useFallbackQuotes();
                    setTimeout(() => this.hideStatus(), 5000);
                } finally {
                    this.isLoading = false;
                }
            }

            useFallbackQuotes() {
                this.quotes = this.fallbackQuotes;
                this.initializeShuffledQuotes();
                this.displayInitialQuote();
            }

            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            initializeShuffledQuotes() {
                this.shuffledQuotes = this.shuffleArray(this.quotes);
                this.currentShuffleIndex = 0;
            }

            getNextQuote() {
                if (this.isLoading || this.quotes.length === 0) return null;
                
                if (this.currentShuffleIndex >= this.shuffledQuotes.length) {
                    this.initializeShuffledQuotes();
                }

                const quote = this.shuffledQuotes[this.currentShuffleIndex];
                this.currentShuffleIndex++;
                return quote;
            }

            displayInitialQuote() {
                const selectedQuote = this.getNextQuote();
                if (!selectedQuote) return;
                
                // Immediately show the quote without delay
                this.updateQuoteDisplay(selectedQuote);
            }

            updateQuoteDisplay(quote) {
                const quoteText = document.getElementById('quoteText');
                const quoteAuthor = document.getElementById('quoteAuthor');
                const quoteSource = document.getElementById('quoteSource');
                
                quoteText.textContent = `"${quote.text}"`;
                
                let authorText = quote.author || '';
                if (quote.occupation && quote.occupation.trim()) {
                    authorText += `, ${quote.occupation}`;
                }
                
                if (authorText) {
                    quoteAuthor.textContent = authorText;
                    quoteAuthor.style.display = 'block';
                } else {
                    quoteAuthor.style.display = 'none';
                }
                
                // Handle source with optional URL
                if (quote.source && quote.source.trim()) {
                    if (quote.source_url && quote.source_url.trim()) {
                        // Create clickable link
                        quoteSource.innerHTML = `<a href="${quote.source_url}" target="_blank" rel="noopener noreferrer">${quote.source}</a>`;
                    } else {
                        // Just text
                        quoteSource.textContent = quote.source;
                    }
                    quoteSource.style.display = 'block';
                } else {
                    quoteSource.style.display = 'none';
                }
            }

            async refreshQuotes() {
                const refreshBtn = document.getElementById('refreshBtn');
                refreshBtn.disabled = true;
                refreshBtn.textContent = 'refreshing...';
                
                try {
                    this.updateStatus('Checking for updates...', 'loading');
                    
                    // Add timestamp to bypass cache
                    const refreshUrl = this.quotesUrl + '?t=' + Date.now();
                    const response = await fetch(refreshUrl);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    this.quotes = data.quotes || [];
                    this.initializeShuffledQuotes();
                    
                    this.hideStatus();
                } catch (error) {
                    console.error('Failed to refresh quotes:', error);
                    this.updateStatus('Refresh failed - using existing quotes', 'error');
                    setTimeout(() => this.hideStatus(), 5000);
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'refresh';
                }
            }

            updateStatus(message, type = '') {
                const statusIndicator = document.getElementById('statusIndicator');
                statusIndicator.textContent = message;
                statusIndicator.className = `status-indicator ${type}`;
                statusIndicator.style.display = 'block';
            }

            hideStatus() {
                const statusIndicator = document.getElementById('statusIndicator');
                statusIndicator.style.display = 'none';
            }
        }

        // Initialize the quote manager
        const quoteManager = new QuoteManager();

        // Get random quote function
        function getRandomQuote() {
            const quoteText = document.getElementById('quoteText');
            const quoteAttribution = document.getElementById('quoteAttribution');
            const nextNoteBtn = document.getElementById('nextNoteBtn');

            nextNoteBtn.disabled = true;
            nextNoteBtn.innerHTML = 'loading...';

            quoteText.style.opacity = '0';
            quoteAttribution.style.opacity = '0';

            setTimeout(() => {
                const selectedQuote = quoteManager.getNextQuote();
                if (!selectedQuote) {
                    nextNoteBtn.disabled = false;
                    nextNoteBtn.innerHTML = 'next quote <span class="btn-arrow">→</span>';
                    return;
                }

                setTimeout(() => {
                    quoteManager.updateQuoteDisplay(selectedQuote);
                    
                    quoteText.style.opacity = '1';
                    quoteAttribution.style.opacity = '1';
                    
                    nextNoteBtn.disabled = false;
                    nextNoteBtn.innerHTML = 'next quote <span class="btn-arrow">→</span>';
                }, 200);
            }, 400);
        }

        // Refresh quotes function
        function refreshQuotes() {
            quoteManager.refreshQuotes();
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Home circle click functionality
            const homeCircle = document.querySelector('.home-circle');
            if (homeCircle) {
                homeCircle.addEventListener('click', function() {
                    window.location.href = 'https://jb-kang.com/index';
                });
            }
        });
        
        // Back arrow functionality
        function goBack() {
            if (document.referrer && document.referrer !== window.location.href) {
                window.history.back();
            } else {
                window.location.href = 'https://jb-kang.com/index';
            }
        }
    </script>
</body>
</html>
